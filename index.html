<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casa dos Parafusos</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>
    <div id="head-text">
            <p>CASA DOS PARAFUSOS <span>&#8226;</span> FERRAMENTAS, FIXADORES E EPIs</p>

    <button id="open-sidebar-btn" onclick="openSidebar()">

    </button>

     <section id="navbar-section">

        </div>

        <nav id="navbar">
            <div class="navbar">
                <ul>
                    <li>
                        <button id="close-sidebar-btn" onclick="closeSidebar()">
                            <svg xmlns="http://www.w3.org/2000/svg" height="40px" viewBox="0 0 384 512"><!--!Font Awesome Free v7.3.1 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.--><path fill="#ede8e8" d="M55.1 73.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L147.2 256 9.9 393.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L192.5 301.3 329.9 438.6c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L237.8 256 375.1 118.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L192.5 210.7 55.1 73.4z"/></svg>

                    <li class="home-li"><a href="#home">Início</a></li>
                    <li><a href="#produtos">Produtos</a></li>
                    <li><a href="#sobre">Quem somos</a></li>
                    <li><a href="#diferenciais">Diferenciais</a></li>
                    <li><a href="#contato">Contato</a></li>
                    <li><button class="botaoAtendimento"><a href="#atendimento">Falar com a loja</a></button></li>
                </ul>
            </div>
        </nav>

        <div id="overlay" onclick="closeSidebar()"></div>

     </section>
    
<script>
    const navbar = document.getElementById('navbar');

    function openSidebar() {
        navbar.classList.add('show');
    }

    function closeSidebar() {
        navbar.classList.remove('show');
    }

</script>
        
    
</body>
</html>
